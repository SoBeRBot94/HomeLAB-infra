---
- name: remove existing vm template
  community.proxmox.proxmox_kvm:
    vmid: "{{ item.id }}"
    state: absent
    force: true
  ignore_errors: true

- name: build fedora golden image
  when: item.os == 'fedora'
  block:
    - name: fetch cloud image
      get_url:
        url:  "{{ vm_base_image }}"
        dest: "{{ item.image_path }}"
        mode: '0644'
        timeout: "{{ download_timeout }}"
      register: download
      until: download is succeeded
      retries: 3
      delay: 10

    # passt networking is broken with pve-qemu-kvm 11.1 (no DHCP reply in the libguestfs appliance);
    # a failing passt stub makes libguestfs fall back to QEMU's built-in SLIRP network
    - name: create passt stub directory
      file:
        path: "{{ libguestfs_nopasst_dir }}"
        state: directory
        mode: '0755'

    - name: create passt stub for libguestfs
      copy:
        dest: "{{ libguestfs_nopasst_dir }}/passt"
        content: "#!/bin/sh\nexit 127\n"
        mode: '0755'

    - name: customize cloud image
      environment:
        PATH: "{{ libguestfs_nopasst_dir }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      command:
        cmd: >
          virt-customize -a {{ item.image_path }}
          --run-command 'dnf copr enable -y atim/starship'
          --run-command 'dnf update -y'
          --install {{ packages | join(',') }}
          --run-command 'chsh -s /usr/bin/zsh'
          --run-command 'systemctl enable qemu-guest-agent'
          --run-command 'dnf clean all'
          --truncate /etc/machine-id
      changed_when: true

- name: build talos golden image
  when: item.os == 'talos'
  block:
    - name: register image factory schematic
      uri:
        url: "{{ talos_schematic_url }}"
        method: POST
        body: "{{ talos_schematic | to_yaml }}"
        status_code: [200, 201]
      register: schematic

    - name: show installer image
      debug:
        msg: "installer image: {{ talos_installer_image }}"

    - name: fetch talos image
      get_url:
        url: "{{ talos_image_url }}"
        dest: "{{ item.image_path }}.xz"
        mode: '0644'
        timeout: "{{ download_timeout }}"
      register: download
      until: download is succeeded
      retries: 3
      delay: 10

    - name: decompress talos image
      command:
        cmd: xz -dkf {{ item.image_path }}.xz
        creates: "{{ item.image_path }}"

- name: build opnsense golden image
  when: item.os == 'opnsense'
  block:
    - name: fetch opnsense image
      get_url:
        url: "{{ opnsense_image_url }}"
        dest: "{{ item.image_path }}.bz2"
        mode: '0644'
        timeout: "{{ download_timeout }}"
      register: download
      until: download is succeeded
      retries: 3
      delay: 10

    - name: decompress opnsense image
      command:
        cmd: bunzip2 -kf {{ item.image_path }}.bz2
        creates: "{{ item.image_path }}"

- name: create vm
  community.proxmox.proxmox_kvm:
    vmid: "{{ item.id }}"
    name: "{{ item.name }}"
    description: "{{ ('Talos ' ~ talos_version ~ ', schematic ' ~ schematic.json.id) if item.os == 'talos' else (item.description | default(omit)) }}"
    ostype: l26
    cpu: host
    cores: "{{ vm_template_cores }}"
    memory: "{{ vm_template_memory }}"
    net:
      net0: "virtio,bridge={{ template_bridge }}"
    agent: "{{ 'enabled=0' if item.os == 'opnsense' else 'enabled=1' }}"
    serial:
      serial0: socket
    vga: serial0
    bios: seabios
    state: present

- name: import disk image
  command:
    cmd: >
      qm set {{ item.id }}
      --scsihw virtio-scsi-pci
      --virtio0 {{ template_storage }}:0,import-from={{ item.image_path }},discard=on,iothread=1
  changed_when: true

- name: add cloud-init drive
  when: item.os != 'opnsense'
  command:
    cmd: >
      qm set {{ item.id }} --ide2 {{ template_storage }}:cloudinit
  changed_when: true

- name: Set boot order
  command:
    cmd: >
      qm set {{ item.id }} --boot order=virtio0
  changed_when: true

- name: Convert to template
  community.proxmox.proxmox_kvm:
    vmid: "{{ item.id }}"
    template: true
    update: true
