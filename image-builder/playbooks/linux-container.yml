---
- hosts: hypervisors
  gather_facts: false
  vars_files:
    - ../vars/variables.yml
    - ../vars/secrets.yml
  module_defaults:
      group/community.proxmox.proxmox:
        api_host: "{{ ansible_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        node: "{{ inventory_hostname }}"
        validate_certs: false

  tasks:
    - name: fetch base appliance template
      community.proxmox.proxmox_template:
        content_type: vztmpl
        storage: local
        template: "{{ ct_base_image }}"
        state: present

    - name: build container template
      include_tasks: build_container_template.yml
      loop: "{{ ct_template_builds }}"
      loop_control:
        label: "{{ item.name }}"
