---
- hosts: hypervisors
  gather_facts: false
  vars_files:
    - ../vars/variables.yml
    - ../vars/secrets.yml
  module_defaults:
      group/community.proxmox.proxmox:
        api_host: "{{ ansible_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        node: "{{ inventory_hostname }}"
        validate_certs: false

  tasks:
    - name: install system packages
      apt:
        package: "{{ item }}"
        state: latest
      loop:
        - libguestfs-tools
        - python3-pip

    - name: install proxmoxer
      pip:
        name: proxmoxer
        state: latest
        break_system_packages: true

    - name: build vm template
      include_tasks: build_vm_template.yml
      loop: "{{ vm_template_builds | selectattr('os', 'in', vm_template_select) }}"
      loop_control:
        label: "{{ item.name }}"
