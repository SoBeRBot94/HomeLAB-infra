template_vm_id: 1000 
template_name: "fedora-44-golden"
template_storage: "local-lvm"
template_cores: 2
template_memory: 2048
template_bridge: "vmbr0"

cloud_image_url: "https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2"
cloud_image_filename: "Fedora-Cloud-Base-44.qcow2"
cloud_image_path: "/tmp/{{ cloud_image_filename }}"

packages:
  - bat
  - curl
  - eza
  - fd
  - fzf
  - kitty-terminfo
  - neovim
  - procs
  - qemu-guest-agent
  - ripgrep
  - starship
  - wget
  - wipe
  - zoxide
  - zsh
