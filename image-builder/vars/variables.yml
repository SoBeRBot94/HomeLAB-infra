vm_template_id: 1000 
vm_template_name: "fedora-44-golden-vm"
vm_template_cores: 2
vm_template_memory: 2048
vm_base_image: "https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2"
vm_base_image_filename: "Fedora-Cloud-Base-44.qcow2"
vm_base_image_path: "/tmp/{{ vm_base_image_filename }}"

ct_template_id: 2000
ct_template_name: "fedora-44-golden-lxc"

ct_template_privileged_id: 3000
ct_template_privileged_name: "fedora-44-golden-lxc-privileged"

ct_template_builds:
  - id: "{{ ct_template_id }}"
    name: "{{ ct_template_name }}"
    unprivileged: true
  - id: "{{ ct_template_privileged_id }}"
    name: "{{ ct_template_privileged_name }}"
    unprivileged: false

ct_template_cores: 2
ct_template_memory: 1024
ct_template_disk: 8
ct_base_image: "fedora-44-default_20260713_amd64.tar.xz"
ct_template_path: "/var/lib/vz/template/cache/{{ ct_template_name }}.tar.zst"
ct_template_packages: "{{ (packages | reject('equalto', 'qemu-guest-agent') | list) + ['openssh-server', 'ncurses'] }}"
ct_ssh_key_match: "infrastructre"

template_storage: "local-lvm"
template_bridge: "vmbr0"
packages:
  - bat
  - curl
  - eza
  - fd
  - fzf
  - kitty-terminfo
  - neovim
  - procs
  - qemu-guest-agent
  - ripgrep
  - starship
  - wget
  - wipe
  - zoxide
  - zsh

talos_template_id: 1100
talos_template_name: "talos-{{ talos_version | regex_replace('^v', '') }}-golden-vm"
talos_version: "v1.14.6"
talos_platform: "nocloud"
talos_factory_host: "factory.talos.dev"
talos_schematic_url: "https://{{ talos_factory_host }}/schematics"
talos_image_url: "https://{{ talos_factory_host }}/image/{{ schematic.json.id }}/{{ talos_version }}/{{ talos_platform }}-amd64.raw.xz"
talos_installer_image: "{{ talos_factory_host }}/{{ talos_platform }}-installer/{{ schematic.json.id }}:{{ talos_version }}"
talos_schematic:
  customization:
    systemExtensions:
      officialExtensions:
        - siderolabs/qemu-guest-agent
talos_image_path: "/tmp/talos-{{ talos_version }}-{{ talos_platform }}-amd64.raw"

vm_template_builds:
  - id: "{{ vm_template_id }}"
    name: "{{ vm_template_name }}"
    os: fedora
    image_path: "{{ vm_base_image_path }}"
  - id: "{{ talos_template_id }}"
    name: "{{ talos_template_name }}"
    os: talos
    image_path: "{{ talos_image_path }}"

vm_template_select: [fedora, talos]
