vm_template_id: 1000 
vm_template_name: "fedora-44-golden-vm"
vm_template_cores: 2
vm_template_memory: 2048
vm_base_image: "https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2"
vm_base_image_filename: "Fedora-Cloud-Base-44.qcow2"
vm_base_image_path: "/tmp/{{ vm_base_image_filename }}"

ct_template_id: 2000
ct_template_name: "fedora-44-golden-lxc"
ct_template_cores: 2
ct_template_memory: 1024
ct_template_disk: 8
ct_base_image: "fedora-44-default_20260713_amd64.tar.xz"
ct_template_path: "/var/lib/vz/template/cache/{{ ct_template_name }}.tar.zst"
ct_template_packages: "{{ (packages | reject('equalto', 'qemu-guest-agent') | list) + ['openssh-server'] }}"

template_storage: "local-lvm"
template_bridge: "vmbr0"
packages:
  - bat
  - curl
  - eza
  - fd
  - fzf
  - kitty-terminfo
  - neovim
  - procs
  - qemu-guest-agent
  - ripgrep
  - starship
  - wget
  - wipe
  - zoxide
  - zsh
